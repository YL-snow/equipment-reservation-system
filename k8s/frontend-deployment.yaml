apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-frontend
  namespace: app
  labels:
    app: equipment-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: equipment-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: equipment-frontend
    spec:
      containers:
      - name: equipment-frontend
        image: 10.160.199.150:8443/32301163/equipment-frontend:v2.0.10
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: equipment-frontend
  namespace: app
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: equipment-frontend